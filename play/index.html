<style>
  :root{
    --bg:#08080a;
    --ink:#edebe7;
    --muted:#8b8880;
    --line:#1e1e21;
    --accent:#35e0a1;
    --measure:34rem;
  }

  *,*::before,*::after{box-sizing:border-box}

  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  main{
    max-width:var(--measure);
    margin:0 auto;
    padding:22vh 1.5rem 6rem;
  }

  h1{
    font-size:1.9rem;
    font-weight:500;
    letter-spacing:-0.01em;
    margin:0 0 .6rem;
  }

  p{color:var(--muted);margin:0 0 1.6rem}

  .cta{
    display:inline-block;
    padding:.7rem 1.4rem;
    border:1px solid var(--accent);
    border-radius:2px;
    color:var(--accent);
    text-decoration:none;
    font-weight:500;
  }

  .cta:hover{background:var(--accent);color:var(--bg)}

  footer{
    margin-top:4rem;
    padding-top:1.4rem;
    border-top:1px solid var(--line);
    font-size:.86rem;
    color:var(--muted);
  }

  footer a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Synapse</h1>
  <p>Minimal neural tower defense for iPhone. Sixteen signal paths, sixteen mythical spores, one to earn on every full clear.</p>
  <p><a class="cta" href="https://apps.apple.com/app/id6807713910">View on the App Store</a></p>
  <footer>
    <a href="/">Disquiet Studio</a> · <a href="/privacy">Privacy</a> · <a href="/terms/">Terms</a>
  </footer>
</main>
</body>
</html>
